name: Actualizar datos
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_data.py
      - run: |
          git config user.name SpaceGroks
          git config user.email spaguettibot+github@mail.grokbot.com
          git add data.json
          git diff --cached --quiet || (git commit -m "Datos del $(date -u +%F)" && git push)
